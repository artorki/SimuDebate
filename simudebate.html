<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimuDebate | artorki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #12131c; 
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #side-panel {
            position: absolute;
            top: 0;
            right: -450px;
            width: 100%;
            max-width: 420px;
            height: 100%;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(100px);
            -webkit-backdrop-filter: blur(100px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            transition: right 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: -30px 0 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
        }

        #side-panel.open { right: 0; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        .form-input {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            color: white;
            outline: none;
            transition: all 0.3s;
        }
        .form-input:focus { border-color: #6366f1; box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }
        
        .form-input option {
            background-color: #12131c; 
            color: #ffffff;
        }
    </style>
</head>
<body class="text-white selection:bg-indigo-500/30">

    <div id="canvas-container"></div>

    <div id="side-panel" class="text-right p-8">
        <div class="flex justify-between items-center mb-8 pt-4">
            <button id="close-btn" class="w-11 h-11 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center transition-all hover:scale-105 hover:rotate-90">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="flex items-center gap-4">
                <div class="flex flex-col items-end">
                    <h2 id="panel-title" class="text-2xl font-extrabold text-white tracking-tight">نام اتاق</h2>
                    <span id="panel-subtitle" class="text-xs text-white/50 mt-1">مدیریت بخش</span>
                </div>
                <div id="panel-icon" class="w-14 h-14 rounded-2xl flex items-center justify-center text-3xl shadow-lg border border-white/20"></div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto pr-2 pb-6 flex flex-col">
            <div id="panel-content" class="w-full h-full relative">
                
                <div id="panel-meeting" class="hidden panel-section flex flex-col h-full space-y-3">
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/10 shadow-inner shrink-0">
                        <div class="mb-3">
                            <label class="block text-xs text-white/60 mb-1.5 font-bold">موضوع مناظره</label>
                            <textarea id="debateTopic" rows="2" class="form-input resize-none text-sm">Consciousness and Time</textarea>
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs text-white/60 mb-1.5 font-bold flex justify-between">
                                <span>حداکثر نوبت‌ها</span>
                                <span id="maxTurnsVal" class="text-amber-400">15</span>
                            </label>
                            <input type="range" id="maxTurns" min="5" max="50" value="15" class="w-full accent-amber-500">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <button id="startDebateBtn" class="bg-amber-500/20 hover:bg-amber-500/40 text-amber-400 border border-amber-500/50 py-2.5 rounded-xl text-sm font-bold transition-all shadow-[0_0_15px_rgba(245,158,11,0.2)]">شروع مناظره</button>
                            <button id="stopDebateBtn" class="bg-red-500/20 hover:bg-red-500/40 text-red-400 border border-red-500/50 py-2.5 rounded-xl text-sm font-bold transition-all shadow-[0_0_15px_rgba(239,68,68,0.2)]">توقف</button>
                        </div>
                        <button id="synthesisBtn" class="w-full bg-purple-500/20 hover:bg-purple-500/40 text-purple-400 border border-purple-500/50 py-2.5 rounded-xl text-sm font-bold transition-all shadow-[0_0_15px_rgba(168,85,247,0.2)]">سنتز و جمع‌بندی</button>

                        <div class="mt-4 pt-3 border-t border-white/10 flex justify-between items-center text-sm">
                            <span class="text-white/60">وضعیت: <span id="debateStatus" class="text-white font-bold">متوقف</span></span>
                            <span class="text-white/60">نوبت: <span id="debateTurn" class="text-white font-bold">0 / 15</span></span>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-center px-4 py-2 bg-black/40 rounded-xl border border-white/10 text-xs font-bold text-white/70 shadow-inner shrink-0">
                        <span>توکن‌های مصرفی: <span id="logTokens" class="text-cyan-400">0</span></span>
                        <span>هزینه تقریبی: <span id="logCost" class="text-green-400">$0.0000</span></span>
                    </div>
                    
                    <div id="chatHistory" class="flex-1 overflow-y-auto space-y-3 pr-2 scrollbar-thin rounded-xl p-2 bg-black/20 border border-white/5">
                        <div class="text-center text-white/40 text-xs py-10">تاریخچه مناظره هنوز خالی است.</div>
                    </div>

                    <div class="mt-auto bg-black/40 p-2 rounded-xl border border-white/10 flex gap-2 shrink-0">
                        <input type="text" id="hostInput" placeholder="پیام شما به عنوان هاست..." class="flex-1 bg-transparent border-none outline-none text-sm text-white px-3">
                        <button id="hostSubmitBtn" class="bg-cyan-500 hover:bg-cyan-600 text-white p-2 rounded-lg transition-colors shadow-lg">
                            <svg class="w-5 h-5 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        </button>
                    </div>
                </div>

                <div id="panel-pr" class="hidden panel-section space-y-4">
                    <div class="bg-white/5 p-5 rounded-2xl border border-white/10 shadow-inner">
                        <label class="flex items-center gap-3 cursor-pointer mb-5 bg-black/20 p-3 rounded-xl">
                            <input type="checkbox" id="tgEnable" class="w-4 h-4 text-pink-500 rounded bg-black/30 border-white/20">
                            <span class="text-sm font-bold">فعال‌سازی ارسال به تلگرام</span>
                        </label>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs text-white/60 mb-1.5 font-bold">Bot Token (توکن بات)</label>
                                <input type="password" id="tgToken" placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11" class="form-input">
                            </div>
                            <div>
                                <label class="block text-xs text-white/60 mb-1.5 font-bold">Chat ID (آیدی گروه/شخص)</label>
                                <input type="text" id="tgChatId" placeholder="-1001234567890" class="form-input">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="panel-tech" class="hidden panel-section space-y-4">
                    <div class="bg-white/5 p-5 rounded-2xl border border-white/10 shadow-inner space-y-4">
                        <div>
                            <label class="block text-xs text-white/60 mb-1.5 font-bold">حالت اتصال (Mode)</label>
                            <select id="apiMode" class="form-input font-sans appearance-none">
                                <option value="Single">Single (همه مهمان‌ها از یک API)</option>
                                <option value="Multi">Multi (هر مهمان API مجزا دارد)</option>
                            </select>
                        </div>
                        <div id="globalApiSettings" class="space-y-4 pt-4 border-t border-white/10">
                            <div>
                                <label class="block text-xs text-white/60 mb-1.5 font-bold">پروایدر هوش مصنوعی</label>
                                <select id="globalProvider" class="form-input font-sans appearance-none">
                                    <option value="OpenAI">OpenAI</option>
                                    <option value="Anthropic (Claude)">Anthropic (Claude)</option>
                                    <option value="Google (Gemini)">Google (Gemini)</option>
                                    <option value="Local (Ollama/LM Studio)">Local (Ollama/LM Studio)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-white/60 mb-1.5 font-bold">نام مدل (Model)</label>
                                <input type="text" id="globalModel" value="gpt-4o" class="form-input font-sans text-left" dir="ltr">
                            </div>
                            <div>
                                <label class="block text-xs text-white/60 mb-1.5 font-bold">کلید API (میتواند چند تا با کاما باشد)</label>
                                <input type="password" id="globalApiKey" placeholder="sk-..." class="form-input font-sans text-left" dir="ltr">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="panel-library" class="hidden panel-section space-y-4">
                    <div class="bg-white/5 p-5 rounded-2xl border border-white/10 shadow-inner">
                        <label class="block text-xs text-white/60 mb-1.5 font-bold">تعداد مهمان‌ها</label>
                        <input type="number" id="numGuests" min="2" max="5" value="2" class="form-input mb-5">
                        
                        <div id="guestsContainer" class="space-y-4">
                        </div>
                    </div>
                </div>

                <div id="panel-computer" class="hidden panel-section space-y-4">
                    <div class="bg-white/5 p-5 rounded-2xl border border-white/10 shadow-inner space-y-4">
                        <button id="downloadJsonBtn" class="w-full bg-blue-500/20 hover:bg-blue-500/40 text-blue-400 border border-blue-500/50 py-3 rounded-xl text-sm font-bold transition-all shadow-[0_0_15px_rgba(59,130,246,0.2)]">📥 دانلود فایل لاگ مناظره (JSON)</button>
                        <button id="generateMindmapBtn" class="w-full bg-emerald-500/20 hover:bg-emerald-500/40 text-emerald-400 border border-emerald-500/50 py-3 rounded-xl text-sm font-bold transition-all shadow-[0_0_15px_rgba(16,185,129,0.2)]">🧠 ساخت گراف ارتباطی (Mindmap)</button>
                        
                        <div id="mindmapContainer" class="hidden mt-4 w-full h-80 bg-white/10 rounded-xl overflow-auto p-2 border border-white/20 flex justify-center text-white text-left font-sans" dir="ltr">
                            <!-- Mermaid SVG will be injected here -->
                        </div>
                    </div>
                </div>

                <div id="panel-archive" class="hidden panel-section flex flex-col h-full items-center justify-center">
                    <div class="text-center text-white/40 text-sm p-4 bg-black/20 rounded-xl border border-white/5">
                        بخش گفتگو و تاریخچه به <b>سالن جلسات</b> منتقل شده است.
                    </div>
                </div>

            </div>
        </div>
        
        <div class="pt-2 mt-2 border-t border-white/5 text-center text-[10px] text-white/30 tracking-widest font-light">
            SimuDebate | artorki
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'dark', themeVariables: { fontFamily: 'Vazirmatn, Tahoma, sans-serif' } });

        const API_BASE = 'http://127.0.0.1:8765/api';

        let appState = {
            chatHistory: [], turnIndex: 0, isRunning: false, estimatedTokens: 0, estimatedCost: 0, tgOffset: 0, mindmapCode: null,
            guestStates: {},
            settings: {
                topic: "Consciousness and Time", tgEnable: false, tgToken: "", tgChatId: "",
                mode: "Single", globalProvider: "OpenAI", globalModel: "gpt-4o", globalApiKey: "",
                maxTurns: 15, numGuests: 2,
                guests: [
                    { id: "guest_0", name: "مهمان اول", role: "Scientist", school: "Materialism", provider: "OpenAI", model: "gpt-4o", apiKey: "" },
                    { id: "guest_1", name: "مهمان دوم", role: "Philosopher", school: "Idealism", provider: "OpenAI", model: "gpt-4o", apiKey: "" }
                ]
            }
        };

        async function saveState() {
            try { await fetch(`${API_BASE}/state`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(appState) }); } 
            catch(e) { console.warn("Local server not reachable for saving state"); }
        }

        async function loadState() {
            try {
                let res = await fetch(`${API_BASE}/state`);
                if (res.ok) {
                    let data = await res.json();
                    if (data && Object.keys(data).length > 0) {
                        appState = Object.assign({}, appState, data); 
                        document.getElementById('debateTopic').value = appState.settings.topic;
                        document.getElementById('maxTurns').value = appState.settings.maxTurns;
                        document.getElementById('tgEnable').checked = appState.settings.tgEnable;
                        document.getElementById('tgToken').value = appState.settings.tgToken;
                        document.getElementById('tgChatId').value = appState.settings.tgChatId;
                        document.getElementById('apiMode').value = appState.settings.mode;
                        document.getElementById('globalProvider').value = appState.settings.globalProvider;
                        document.getElementById('globalModel').value = appState.settings.globalModel;
                        document.getElementById('globalApiKey').value = appState.settings.globalApiKey;
                        document.getElementById('numGuests').value = appState.settings.numGuests;
                        document.getElementById('globalApiSettings').style.display = appState.settings.mode === 'Single' ? 'block' : 'none';
                        if (appState.mindmapCode) {
                            let container = document.getElementById('mindmapContainer');
                            container.classList.remove('hidden');
                            if(window.mermaid) {
                                try {
                                    let id = `mermaid-svg-load-${Date.now()}`;
                                    const { svg } = await mermaid.render(id, appState.mindmapCode);
                                    container.innerHTML = svg;
                                } catch (err) {
                                    console.error("Mermaid Render Error:", err);
                                    container.innerHTML = `<div class="text-red-400 text-xs p-2">خطا در رندر گراف:</div><pre dir="ltr" class="text-[10px] text-white/50 text-left overflow-auto">${appState.mindmapCode}</pre>`;
                                }
                            }
                        }
                    }
                }
            } catch(e) { console.warn("No persistent state found, using default."); }
        }

        async function callLlmApi(provider, model, apiKeyStr, systemPrompt, prompt, maxTokens = 2000) {
            try {
                let res = await fetch(`${API_BASE}/llm`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ provider, model, api_key: apiKeyStr, system_prompt: systemPrompt, prompt, max_tokens: maxTokens })
                });
                return await res.json();
            } catch (e) {
                console.error("Local Server Error:", e);
                return { content: null, tokens: 0, cost: 0 };
            }
        }

        async function sendTgMessage(text) {
            if (!appState.settings.tgEnable || !appState.settings.tgToken || !appState.settings.tgChatId) return;
            try {
                await fetch(`${API_BASE}/telegram/send`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: appState.settings.tgToken, chat_id: appState.settings.tgChatId, text: text }) });
            } catch(e) { console.warn("Failed to send TG message"); }
        }

        async function fetchTgUpdates() {
            if (!appState.settings.tgEnable || !appState.settings.tgToken || !appState.settings.tgChatId) return [];
            try {
                let res = await fetch(`${API_BASE}/telegram/updates?token=${appState.settings.tgToken}&chat_id=${appState.settings.tgChatId}&offset=${appState.tgOffset}`);
                let data = await res.json();
                appState.tgOffset = data.offset; saveState();
                return data.updates;
            } catch (e) { return []; }
        }

        function parseJsonFromText(text) {
            try { return JSON.parse(text); } catch(e) {}
            try { let match = text.match(/```(?:json)?\s*(\{[\s\S]*?\})\s*```/); if (match) return JSON.parse(match[1]); } catch(e) {}
            try { let match = text.match(/(\{[\s\S]*?\})/); if (match) return JSON.parse(match[1]); } catch(e) {}
            return null;
        }

        function initGuestState(gid) {
            if (!appState.guestStates[gid]) appState.guestStates[gid] = { beliefs: [], claims: [], supported_claims: [], challenged_claims: [], concessions: [], uncertainties: [], objectives: [], opponents: {} };
        }

        function trimState(stateDict, maxItems = 15) {
            if (typeof stateDict !== 'object' || !stateDict) return stateDict;
            for (let k in stateDict) { if (Array.isArray(stateDict[k]) && stateDict[k].length > maxItems) stateDict[k] = stateDict[k].slice(-maxItems); }
            return stateDict;
        }

        function addToHistory(speaker, role, text, tokens = 0, cost = 0.0) {
            appState.chatHistory.push({ timestamp: new Date().toISOString(), speaker, role, text });
            appState.estimatedTokens += tokens > 0 ? tokens : Math.floor(text.split(' ').length * 1.3);
            appState.estimatedCost += cost;
            saveState();
        }

        function generateTranscript() {
            if (appState.chatHistory.length === 0) return "Start";
            let history = appState.chatHistory, transcript = "";
            if (history.length > 10) {
                transcript = "Key Initial Claims:\n" + history.slice(0, 3).map(m => `[${m.speaker} - ${m.role}]: ${m.text}`).join('\n') + 
                             "\n\n[Rolling Summary / Middle Turns Omitted]\n\nActive Disagreements and Recent Turns:\n" + 
                             history.slice(-7).map(m => `[${m.speaker} - ${m.role}]: ${m.text}`).join('\n');
            } else {
                transcript = "Raw Transcript:\n" + history.map(m => `\n[${m.speaker} - ${m.role}]: ${m.text}`).join('\n');
            }
            return transcript;
        }

        function getGuestSystemPrompt(guest, state, mode) {
            let stateStr = JSON.stringify(state || {});
            let base = `تو نقش یک ${guest.role} با مکتب ${guest.school} به اسم ${guest.name} رو داری.\nموضوع: ${appState.settings.topic}\nوضعیت شناختی تو تا این لحظه:\n${stateStr}\n\nقوانین:\n1. رفتار متخصص و علمی.\n2. ارجاع معتبر، بدون توهم.\n3. پرهیز از گزافه‌گویی.\n4. بدون جملات کلیشه‌ای.\n5. پاسخ به تلگرام در صورت وجود.`;
            if (mode === "turn") base += `\nخروجی تو باید دقیقاً یک JSON معتبر با ساختار زیر باشد:\n{\n  "state": {\n    "beliefs": ["باورهای پایه تو"],\n    "claims": ["ادعاهای جدید تو در این نوبت"],\n    "supported_claims": ["ادعاهای دیگران که تایید می‌کنی"],\n    "challenged_claims": ["ادعاهای دیگران که رد می‌کنی"],\n    "concessions": ["عقب‌نشینی‌های تو"],\n    "uncertainties": ["نقاط ابهام"],\n    "objectives": ["هدف تو در ادامه بحث"],\n    "opponents": {"نام مهمان": "وضعیت مخالفت"}\n  },\n  "spoken_text": "متن پاسخ تو در مناظره"\n}`;
            else if (mode === "interrupt") base += `\nقوانین وقفه: تنها در صورتی که تناقض شدید، خطای فاحش یا حمله مستقیم وجود دارد وقفه ایجاد کن.\nخروجی تو باید دقیقاً یک JSON معتبر با ساختار زیر باشد:\n{\n  "interrupt": true یا false,\n  "reason": "دلیل وقفه",\n  "text": "جمله کوتاه وقفه (حداکثر 15 کلمه)"\n}`;
            return base;
        }

        let loopTimeout = null;
        async function debateLoop() {
            if (!appState.isRunning) return;
            if (appState.turnIndex >= appState.settings.maxTurns) {
                appState.isRunning = false; updateUI(); saveState();
                if(appState.settings.tgEnable) sendTgMessage("End"); return;
            }

            document.getElementById('debateStatus').innerText = "در حال تفکر...";
            
            // اصلاح شماره 1: خواندن پیام‌های تلگرام به صورت پیوسته (حذف محدودیت)
            if (appState.settings.tgEnable) {
                let updates = await fetchTgUpdates();
                for (let u of updates) addToHistory(u.user, "Telegram", u.text);
            }

            let cGuest = appState.settings.guests[appState.turnIndex % appState.settings.numGuests];
            initGuestState(cGuest.id);

            if (appState.chatHistory.length > 1) {
                let others = appState.settings.guests.filter(g => g.id !== cGuest.id);
                let interrupter = others[Math.floor(Math.random() * others.length)];
                let iKey = appState.settings.mode === "Multi" ? interrupter.apiKey : appState.settings.globalApiKey;
                let iProv = appState.settings.mode === "Multi" ? interrupter.provider : appState.settings.globalProvider;
                let iMod = appState.settings.mode === "Multi" ? interrupter.model : appState.settings.globalModel;

                initGuestState(interrupter.id);
                let intRes = await callLlmApi(iProv, iMod, iKey, getGuestSystemPrompt(interrupter, appState.guestStates[interrupter.id], "interrupt"), generateTranscript() + "\n\nآیا شرایط وقفه برقرار است؟", 150);
                if (intRes.content && !intRes.content.includes("[خطا")) {
                    let intData = parseJsonFromText(intRes.content);
                    if (intData && intData.interrupt && intData.text) {
                        addToHistory(interrupter.name, "Interruption", `*(می‌پرد وسط حرف)* ${intData.text}`, intRes.tokens, intRes.cost);
                        if (appState.settings.tgEnable) sendTgMessage(`${interrupter.name}:\n${intData.text}`);
                        updateUI();
                    }
                }
            }

            if (!appState.isRunning) return;

            let cKey = appState.settings.mode === "Multi" ? cGuest.apiKey : appState.settings.globalApiKey;
            let cProv = appState.settings.mode === "Multi" ? cGuest.provider : appState.settings.globalProvider;
            let cMod = appState.settings.mode === "Multi" ? cGuest.model : appState.settings.globalModel;

            let res = await callLlmApi(cProv, cMod, cKey, getGuestSystemPrompt(cGuest, appState.guestStates[cGuest.id], "turn"), generateTranscript() + `\n\nحالا نوبت توست ${cGuest.name}. پاسخ بده:`, 2000);
            
            if (!appState.isRunning) return;

        function createMicroTexture(seed = 17) {
            const size = 256; const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d'); const img = ctx.createImageData(size, size);
            let state = seed >>> 0; const rand = () => { state = (1664525 * state + 1013904223) >>> 0; return state / 4294967296; };
            const grid = 48; const coarse = Array.from({length: grid}, () => Array.from({length: grid}, () => rand()));
            const smooth = (x, y) => {
                const gx = x / (size / (grid - 1)); const gy = y / (size / (grid - 1));
                const x0 = Math.floor(gx), y0 = Math.floor(gy); const x1 = Math.min(x0 + 1, grid - 1), y1 = Math.min(y0 + 1, grid - 1);
                const tx = gx - x0, ty = gy - y0; const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
                const a = coarse[y0][x0] * (1 - sx) + coarse[y0][x1] * sx; const b = coarse[y1][x0] * (1 - sx) + coarse[y1][x1] * sx;
                return a * (1 - sy) + b * sy;
            };
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const n1 = smooth(x, y); const n2 = smooth((x * 7 + 19) % size, (y * 7 + 31) % size);
                    const fine = (Math.sin(x * 0.82 + y * 1.17) + Math.sin(x * 1.63 - y * 0.71) + Math.sin((x + y) * 0.37)) / 3;
                    const n = Math.max(0, Math.min(1, n1 * 0.58 + n2 * 0.27 + (fine * 0.08 + 0.08)));
                    const v = Math.floor(92 + n * 136); const i = (y * size + x) * 4;
                    img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 8; tex.needsUpdate = true;
            return tex;
        }

        function pickDestination(currentRoom) {
            const roomIds = Object.keys(ROOMS); let targetRoom = currentRoom;
            if (Math.random() > 0.55) { const others = roomIds.filter(r => r !== currentRoom); targetRoom = others[Math.floor(Math.random() * others.length)]; }
            const roll = Math.random(); let spot;
            if (roll < 0.4 && SIT_SPOTS[targetRoom] && SIT_SPOTS[targetRoom].length && targetRoom !== 'meeting') {
                const s = SIT_SPOTS[targetRoom][Math.floor(Math.random() * SIT_SPOTS[targetRoom].length)]; spot = { pos: new THREE.Vector3(s.x, 0, s.z), facing: s.facing, action: s.action, isSit: true };

        function getSafeRoomPath(roomId, p1, p2) {
            const r = ROOMS[roomId];
            if (!r || !r.safeX) return [];
            let path = [];
            if (Math.abs(p1.z - p2.z) > 1.5) {
                let bestSafeX = r.safeX[0]; let minDist = Infinity;
                r.safeX.forEach(sx => {
                    let d = Math.abs(p1.x - sx) + Math.abs(p2.x - sx);
                    if (d < minDist) { minDist = d; bestSafeX = sx; }
                });
                path.push(new THREE.Vector3(bestSafeX, 0, p1.z));
                path.push(new THREE.Vector3(bestSafeX, 0, p2.z));
            } else if (Math.abs(p1.x - p2.x) > 2.0 && Math.abs(p1.z - r.cz) < 2.0) {
                let doorZ = r.top ? -4.5 : 4.5; 
                path.push(new THREE.Vector3(p1.x, 0, doorZ));
                path.push(new THREE.Vector3(p2.x, 0, doorZ));
            }
            return path;
        }

        // FIX 1: Completely rebuilt path logic to safely route characters using the safe axes.
        function buildPath(fromRoom, toRoom, fromPos, toPos) {
            let path = [];
            if (fromRoom === toRoom) {
                path.push(...getSafeRoomPath(fromRoom, fromPos, toPos));
                path.push(toPos.clone());
                return path;
            }
            let dpFromIn = doorPoint(fromRoom, false);
            let dpFromOut = doorPoint(fromRoom, true);
            let dpToOut = doorPoint(toRoom, true);
            let dpToIn = doorPoint(toRoom, false);

            path.push(...getSafeRoomPath(fromRoom, fromPos, dpFromIn));
            path.push(dpFromIn);
            path.push(dpFromOut);
            
            // Corridor navigation
            path.push(new THREE.Vector3(dpFromOut.x, 0, 0));
            path.push(new THREE.Vector3(dpToOut.x, 0, 0));
            
            path.push(dpToOut);
            path.push(dpToIn);
            path.push(...getSafeRoomPath(toRoom, dpToIn, toPos));
            path.push(toPos.clone());
            return path;
        }

            let numNeeded = appState.settings.numGuests;

            if (debaters.length < numNeeded) {
                let toAdd = numNeeded - debaters.length; let availableChars = characters.filter(c => !c.isDebater);
                for (let i = 0; i < toAdd && i < availableChars.length; i++) {
                    let char = availableChars[i]; char.isDebater = true;
                    let freeSpot = SIT_SPOTS.meeting.find(s => !s.occupiedBy);
                    if (freeSpot) {
                        freeSpot.occupiedBy = char; char.assignedSpot = freeSpot;
                        startWalkingTo(char, { room: 'meeting', pos: new THREE.Vector3(freeSpot.x, 0, freeSpot.z), facing: freeSpot.facing, action: freeSpot.action, isSit: true });
                    }
                }
            } else if (debaters.length > numNeeded) {
                let toRemove = debaters.length - numNeeded;
                for (let i = 0; i < toRemove; i++) {
                    let char = debaters[i]; char.isDebater = false;
                    if (char.assignedSpot) { char.assignedSpot.occupiedBy = null; char.assignedSpot = null; }
                    char.waitTimer = 0; 
                }
            }
        }

        function createCharacter(roomId, x, z, color, spot) {
            const group = new THREE.Group();
            const bodyMat = createClayMaterial(color); const body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.7, 24), bodyMat); body.position.y = 0.35; body.castShadow = true;
            const headMat = createClayMaterial(colors.skin); const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 24), headMat); head.position.y = 0.9; head.castShadow = true;
            group.add(body, head); group.position.set(x, 0, z); scene.add(group);
            if (spot.facing !== null && spot.facing !== undefined) group.rotation.y = spot.facing;
            const char = {
                mesh: group, head: head, body: body, room: roomId, state: spot.isSit ? 'sitting' : 'idle', action: spot.action || 'idle',
                path: [], pathIndex: 0, speed: 1.4 + Math.random() * 0.6, waitTimer: 2 + Math.random() * 6, timeOffset: Math.random() * 100, isDebater: false, assignedSpot: null
            };
            characters.push(char); return char;
        }

        function spawnCharacters() {
            const seeds = [
                { room: 'computer', x: -11.5, z: -7.175, color: 0x3b82f6, facing: Math.PI, action: 'typing',   isSit: true },
                { room: 'computer', x: -8.5,  z: -7.175, color: 0xef4444, facing: Math.PI, action: 'typing',   isSit: true },
                { room: 'library',  x: -9,    z: 9.5,     color: 0x8b5cf6, facing: 0,       action: 'idle',     isSit: false },
                { room: 'library',  x: -11,   z: 9.5,     color: 0x10b981, facing: Math.PI, action: 'idle',     isSit: false },
                { room: 'pr',       x: 8.5,   z: -7.175,  color: 0xec4899, facing: Math.PI, action: 'typing',   isSit: true },
                { room: 'pr',       x: 12.3,  z: -6.8,    color: 0xffffff, facing: null,    action: 'talking',  isSit: false },
                { room: 'library',  x: -9,    z: 10.575,  color: 0xf59e0b, facing: Math.PI, action: 'reading',  isSit: true },
                { room: 'library',  x: -10.5, z: 10.9,    color: 0x64748b, facing: null,    action: 'idle',     isSit: false },
                { room: 'archive',  x: 0,     z: 10.175,  color: 0x14b8a6, facing: Math.PI, action: 'searching',isSit: true },
                { room: 'tech',     x: 10,    z: 10.875,  color: 0xd946ef, facing: Math.PI, action: 'typing',   isSit: true }
            ];
            seeds.forEach(s => createCharacter(s.room, s.x, s.z, s.color, { facing: s.facing, action: s.action, isSit: s.isSit }));
        }

        function animateCharacters(elapsedTime, delta) {
            characters.forEach(char => {
                const t = elapsedTime + char.timeOffset;
                char.body.scale.y = 1 + Math.sin(t * 2.5) * 0.04; 
                char.head.position.y = 0.9 + Math.sin(t * 2.5) * 0.02;

                if (char.state === 'walking') {
                    const target = char.path[char.pathIndex]; const pos = char.mesh.position;
                    const dx = target.x - pos.x, dz = target.z - pos.z; const dist = Math.sqrt(dx * dx + dz * dz);
                    if (dist < 0.08) {
                        char.pathIndex++;
                        if (char.pathIndex >= char.path.length) {
                            char.room = char.pendingRoom;
                            if (char.pendingSit) { char.state = 'sitting'; char.mesh.rotation.y = char.pendingFacing; char.action = char.pendingAction; char.waitTimer = 8 + Math.random() * 14; } 
                            else { char.state = 'idle'; char.action = char.pendingAction || 'idle'; char.waitTimer = 3 + Math.random() * 6; }
                        }
                    } else {
                        const step = Math.min(dist, char.speed * delta);
                        pos.x += (dx / dist) * step; pos.z += (dz / dist) * step;
                        const targetAngle = Math.atan2(dx, dz);
                        let angleDiff = targetAngle - char.mesh.rotation.y;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2; while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        char.mesh.rotation.y += angleDiff * Math.min(1, delta * 6); char.body.rotation.x = Math.abs(Math.sin(t * 8)) * 0.06;
                    }
                } else {
                    char.waitTimer -= delta;
                    switch (char.action) {
                        case 'typing': char.head.rotation.y = Math.sin(t * 6) * 0.15; char.head.rotation.x = 0.2 + Math.sin(t * 10) * 0.08; break;
                        case 'sitting': char.head.rotation.x = Math.sin(t * 1.5) * 0.05; break;
                        case 'talking': char.head.rotation.y = Math.sin(t * 4) * 0.25; char.head.rotation.z = Math.sin(t * 5) * 0.08; break;
                        case 'reading': char.head.rotation.x = Math.sin(t * 1.2) * 0.2 - 0.15; break;
                        case 'searching': char.head.rotation.y = Math.sin(t * 1.5) * 0.3; char.head.rotation.x = 0.15; break;
                        case 'fixing': char.body.rotation.x = Math.abs(Math.sin(t * 3)) * 0.1; char.head.rotation.x = 0.3; break;
                        default: char.head.rotation.y = Math.sin(t * 0.8) * 0.3; char.body.rotation.x = 0;
                    }
                    if (char.waitTimer <= 0) {
                        if (!char.isDebater) { startWalkingTo(char, pickDestination(char.room)); } 
                        else { char.waitTimer = 10; }
                    }
                }
            });
        }

        let hoveredRoomId = null;

        function onMouseMove(event) {
            if (event.target.tagName !== 'CANVAS') {
                if (hoveredRoomId) {
                    interactiveRooms.forEach(room => { room.material.color.copy(room.userData.baseColor); if(roomLights[room.userData.id]) { roomLights[room.userData.id].light.intensity = roomLights[room.userData.id].baseInt; } });
                    document.body.style.cursor = 'default'; hoveredRoomId = null;
                }
                return;
            }
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera); const intersects = raycaster.intersectObjects(interactiveRooms);

            interactiveRooms.forEach(room => { room.material.color.copy(room.userData.baseColor); if(roomLights[room.userData.id]) { roomLights[room.userData.id].light.intensity = roomLights[room.userData.id].baseInt; } });
            document.body.style.cursor = 'default'; hoveredRoomId = null;

            if (intersects.length > 0) {
                const object = intersects[0].object; object.material.color.copy(object.userData.hoverColor);
                if(roomLights[object.userData.id]) { roomLights[object.userData.id].light.intensity = roomLights[object.userData.id].hoverInt; }
                document.body.style.cursor = 'pointer'; hoveredRoomId = object.userData.id;
            }
        }

        function onClick(event) {
            if (event.target.tagName !== 'CANVAS') return;
            if (hoveredRoomId) {
                const roomObj = interactiveRooms.find(r => r.userData.id === hoveredRoomId);
                if(roomObj) {
                    openPanel(roomObj.userData);
                    const originalColor = roomObj.material.color.clone(); roomObj.material.color.setHex(0xffffff);
                    setTimeout(() => { roomObj.material.color.copy(originalColor); }, 150);
                }
            }
        }

        const themeStyles = {
            meeting: 'bg-amber-500/20 text-amber-400 border-amber-500/50 shadow-[0_0_20px_rgba(245,158,11,0.4)]',
            pr: 'bg-pink-500/20 text-pink-400 border-pink-500/50 shadow-[0_0_20px_rgba(236,72,153,0.4)]',
            tech: 'bg-green-500/20 text-green-400 border-green-500/50 shadow-[0_0_20px_rgba(34,197,94,0.4)]',
            library: 'bg-purple-500/20 text-purple-400 border-purple-500/50 shadow-[0_0_20px_rgba(168,85,247,0.4)]',
            computer: 'bg-blue-500/20 text-blue-400 border-blue-500/50 shadow-[0_0_20px_rgba(59,130,246,0.4)]',
            archive: 'bg-cyan-500/20 text-cyan-400 border-cyan-500/50 shadow-[0_0_20px_rgba(6,182,212,0.4)]'
        };

        function openPanel(roomData) {
            document.getElementById('panel-title').innerText = roomData.title; document.getElementById('panel-icon').innerText = roomData.icon;
            let iconEl = document.getElementById('panel-icon'); iconEl.className = 'w-14 h-14 rounded-2xl flex items-center justify-center text-3xl border';
            if(themeStyles[roomData.id]) { const classes = themeStyles[roomData.id].split(' '); classes.forEach(c => iconEl.classList.add(c)); }
            document.querySelectorAll('.panel-section').forEach(el => el.classList.add('hidden'));
            let section = document.getElementById(`panel-${roomData.id}`); if(section) section.classList.remove('hidden');
            document.getElementById('side-panel').classList.add('open');
        }

        function closePanel() { document.getElementById('side-panel').classList.remove('open'); }

        // FIX 2: onWindowResize updated for PerspectiveCamera format
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1); const elapsedTime = clock.elapsedTime;
            controls.update(); animateCharacters(elapsedTime, delta); renderer.render(scene, camera);
        }
    </script>
</body>
